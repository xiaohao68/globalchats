name: Build and Push Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (for example 26.1.10)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.USEJDL_GHCR_TOKEN != '' && secrets.USEJDL_GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/usejdl/globalchats:${{ github.event.inputs.version }}
            ghcr.io/usejdl/globalchats:latest
          build-args: |
            GC_VERSION=${{ github.event.inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/usejdl/gc
            gc.version=${{ github.event.inputs.version }}
          cache-from: type=gha,scope=globalchats
          cache-to: type=gha,mode=max,scope=globalchats
