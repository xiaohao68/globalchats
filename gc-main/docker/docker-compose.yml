services:
  db:
    image: postgres:18.3-alpine3.22
    container_name: globalchats-db
    environment:
      POSTGRES_DB: globalchats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalchats"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  app:
    profiles:
      - example
    image: ghcr.io/usejdl/globalchats:latest
    container_name: globalchats-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3300:3300"
    environment:
      NODE_ENV: production
      PORT: "3300"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/globalchats?schema=public
      JWT_SECRET: change-me
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
