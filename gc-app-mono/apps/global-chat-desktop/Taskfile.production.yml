version: '3'

#==============================================================================
# Production Environment Configuration
# 生产环境配置 - Release 模式构建
#==============================================================================

vars:
  # CrabNebula 应用标识
  CN_APPLICATION: chathub/global-chats
  # 环境标识
  MODE: production
  # Sentry DSN
  SENTRY_DSN: https://aae53d1cf7a3812573ee2bbeea1ca71e@o4509418064510976.ingest.us.sentry.io/4509514402168832
  # Tauri 配置文件 (生产环境使用单独配置)
  CONFIG_FILE: ./src-tauri/tauri.production.conf.json
  # 动态变量
  VERSION:
    sh: jq -r '.version' {{.CONFIG_FILE}}
  APP_NAME:
    sh: jq -r '.productName' {{.CONFIG_FILE}}
  NOTES:
    sh: if [ -f "./release-notes/release-notes.md" ]; then cat ./release-notes/release-notes.md; else echo "No release notes available"; fi

env:
  MODE: "{{.MODE}}"
  SENTRY_DSN: "{{.SENTRY_DSN}}"
  VITE_VERSION: "{{.VERSION}}"

tasks:
  #============================================================================
  # 构建任务 (Release 模式 - 无 --debug 标志)
  #============================================================================
  build-frontend:
    desc: Build frontend assets (production)
    cmds:
      - bun run build
    sources:
      - src/**/*
      - package.json
      - ../../packages/**/*
    generates:
      - dist/**/*

  build-macos-x64:
    desc: Build for macOS x86_64 (release)
    cmds:
      - bun tauri build -t x86_64-apple-darwin -c {{.CONFIG_FILE}}

  build-macos-arm64:
    desc: Build for macOS aarch64 (release)
    cmds:
      - bun tauri build -t aarch64-apple-darwin -c {{.CONFIG_FILE}}

  build-xwindows-x64:
    desc: Cross-compile for Windows x86_64 (release)
    cmds:
      - bun tauri build --runner cargo-xwin -t x86_64-pc-windows-msvc -c {{.CONFIG_FILE}}

  build-windows-x64:
    desc: Build for Windows x86_64 (release)
    cmds:
      - bun tauri build -t x86_64-pc-windows-msvc -c {{.CONFIG_FILE}}

  build-macos:
    desc: Build for all macOS platforms
    deps: [build-macos-x64, build-macos-arm64]

  build-all:
    desc: Build for all platforms
    cmds:
      - task: setup-targets
      - task: build-frontend
      - task: build-macos
      - task: build-xwindows-x64

  setup-targets:
    desc: Setup Rust compilation targets
    cmds:
      - rustup target add x86_64-apple-darwin
      - rustup target add aarch64-apple-darwin
      - rustup target add x86_64-pc-windows-msvc
    status:
      - rustup target list --installed | grep -q x86_64-apple-darwin
      - rustup target list --installed | grep -q aarch64-apple-darwin
      - rustup target list --installed | grep -q x86_64-pc-windows-msvc

  #============================================================================
  # 发布任务
  #============================================================================
  draft:
    desc: Create draft release on CrabNebula
    cmds:
      - cn release draft {{.CN_APPLICATION}} --framework tauri --notes "{{.NOTES}}"

  upload:
    desc: Upload build artifacts to CrabNebula
    cmds:
      - cn release upload {{.CN_APPLICATION}} --framework tauri

  publish:
    desc: Publish release
    cmds:
      - cn release publish {{.CN_APPLICATION}} --framework tauri

  release:
    desc: Complete production release pipeline
    cmds:
      - task: info
      - 'echo ""'
      - 'echo "WARNING: PRODUCTION RELEASE - Please confirm you want to proceed"'
      - 'echo "Press Ctrl+C to cancel, or wait 5 seconds to continue..."'
      - sleep 5
      - 'echo ""'
      - 'echo "[1/5] Cleaning..."'
      - rm -rf ./dist && cd ./src-tauri && cargo clean
      - 'echo "[2/5] Installing dependencies..."'
      - bun install && bun graphql-codegen
      - 'echo "[3/5] Building (release mode)..."'
      - task: build-all
      - 'echo "[4/5] Creating draft and uploading..."'
      - task: draft
      - task: upload
      - 'echo "[5/5] Publishing..."'
      - task: publish
      - 'echo ""'
      - 'echo "Production release complete!"'
      - 'echo "Version: {{.VERSION}}"'

  #============================================================================
  # 信息任务
  #============================================================================
  info:
    desc: Show production build information
    silent: true
    cmds:
      - |
        echo "┌─────────────────────────────────────┐"
        echo "│    PRODUCTION BUILD INFORMATION     │"
        echo "├─────────────────────────────────────┤"
        echo "│ App:     {{.CN_APPLICATION}}"
        echo "│ Mode:    {{.MODE}} (release)"
        echo "│ Version: {{.VERSION}}"
        echo "│ Product: {{.APP_NAME}}"
        echo "│ Config:  {{.CONFIG_FILE}}"
        echo "└─────────────────────────────────────┘"
