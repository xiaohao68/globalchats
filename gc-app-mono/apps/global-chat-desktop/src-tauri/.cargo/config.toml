[build]
# ⚠️ 原来是 16，2026-10-20 改成 2。
# 原因：16 个 rustc 并行时，每个编 Tauri 这类大 crate 要 1~2G 内存，
# 总需求 20~30G，而机器总共才 16G（当时可用仅 3.7G）→ 系统疯狂换页，
# rustc 卡在等资源：跑了 29 分钟 CPU 只用了 0.7 秒、内存仅 67MB，
# 看起来像「编译很慢」，实际是完全没在算。release 打包连着卡死两次（1h40m / 29m）。
# 降到 2 之后单批只需 2~4G，稳。机器内存大（32G+）可以调回 8。
jobs = 2
# 编译产物放 D 盘。
# 原因：C 盘 130G 已用到 97%，Tauri 的 target 目录（400~600 个 crate 的
# 机器码 + 元数据 + 调试符号）要占 8~15G。2026-10-20 就是 C 盘只剩 4G 时
# release 编译写不出文件、空转 1 小时 40 分。
# 只影响缓存位置，不影响 exe 体积与功能；删掉这行即恢复默认（src-tauri/target）。
target-dir = "D:\\gc-target"