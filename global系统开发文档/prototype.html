<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chats - Desktop</title>
<style>
/* =====================================================
   Glass Theme Variables
   ===================================================== */
:root {
  --gc-bg-primary: #0a0a1a;
  --gc-bg-secondary: #12122a;
  --gc-bg-tertiary: #1a1a3e;
  --gc-surface-1: rgba(255,255,255,0.03);
  --gc-surface-2: rgba(255,255,255,0.06);
  --gc-surface-3: rgba(255,255,255,0.10);
  --gc-surface-4: rgba(255,255,255,0.14);
  --gc-text-primary: rgba(255,255,255,0.95);
  --gc-text-secondary: rgba(255,255,255,0.65);
  --gc-text-tertiary: rgba(255,255,255,0.40);
  --gc-text-muted: rgba(255,255,255,0.25);
  --gc-brand: #007aff;
  --gc-brand-gradient-end: #5856d6;
  --gc-brand-glow: rgba(0,122,255,0.22);
  --gc-success: #34c759;
  --gc-warning: #ff9500;
  --gc-error: #ff3b30;
  --gc-border-1: rgba(255,255,255,0.06);
  --gc-border-2: rgba(255,255,255,0.10);
  --gc-border-3: rgba(255,255,255,0.14);
  --gc-accent-glow: rgba(0,122,255,0.22);
  --color-platform-telegram: #0088cc;
  --color-platform-whatsapp: #25d366;
  --color-platform-tiktok: #69c9d0;
  --color-platform-linkedin: #0a66c2;
  --color-platform-messenger: #006aff;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background: var(--gc-bg-primary);
  color: var(--gc-text-primary);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* Aurora Background */
.aurora-bg {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%, rgba(0,122,255,0.15) 0%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 85% 20%, rgba(88,86,214,0.12) 0%, transparent 50%),
    radial-gradient(ellipse 70% 50% at 50% 100%, rgba(0,198,255,0.06) 0%, transparent 60%),
    var(--gc-bg-primary);
  animation: auroraShift 20s ease-in-out infinite alternate;
}

@keyframes auroraShift {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.05) rotate(2deg); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gc-text-muted); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--gc-text-tertiary); }

/* =====================================================
   App Shell
   ===================================================== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* Title Bar */
.title-bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 32px;
  background: rgba(18,18,42,0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--gc-border-1);
  flex-shrink: 0;
  -webkit-app-region: drag;
}

.tb-left { display: flex; align-items: center; gap: 12px; padding-left: 12px; }
.tb-center { display: flex; align-items: center; }
.tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding-right: 16px; }

.traffic-lights { display: flex; gap: 8px; }
.tl { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: filter 0.15s; }
.tl-close { background: #ff5f57; }
.tl-min { background: #febc2e; }
.tl-max { background: #28c840; }
.tl:hover { filter: brightness(1.2); }

.version { font-size: 11px; color: var(--gc-text-tertiary); }

/* Mode Switcher */
.mode-switcher {
  display: flex;
  gap: 2px;
  background: rgba(0,0,0,0.15);
  border-radius: 6px;
  padding: 2px;
}
.ms-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: 4px;
  font-size: 11px; border: none; cursor: pointer;
  background: transparent; color: var(--gc-text-secondary);
  transition: all 0.15s;
}
.ms-btn.active { background: rgba(255,255,255,0.9); color: var(--gc-bg-primary); }
.ms-btn:not(.active):hover { color: var(--gc-text-primary); }

.tb-icon-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; border: none; cursor: pointer;
  background: transparent; color: var(--gc-text-secondary);
  transition: all 0.15s;
}
.tb-icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--gc-brand); }

/* =====================================================
   Main Layout
   ===================================================== */
.app-body {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* Left Sidebar (App List) */
.left-sidebar {
  width: 260px;
  flex-shrink: 0;
  background: rgba(18,18,42,0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--gc-border-1);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-mode-switcher {
  display: flex; gap: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 8px; padding: 3px;
  margin-bottom: 8px;
}
.sms-btn {
  flex: 1; display: flex; align-items: center; justify-content: center;
  gap: 5px; padding: 6px; border-radius: 6px;
  font-size: 12px; border: none; cursor: pointer;
  background: transparent; color: var(--gc-text-secondary);
  transition: all 0.15s;
}
.sms-btn.active { background: rgba(255,255,255,0.9); color: var(--gc-bg-primary); }

/* App List Item */
.app-item {
  display: flex; align-items: center; gap: 10px;
  height: 44px; padding: 0 8px;
  border-radius: 10px; cursor: pointer;
  transition: background 0.15s;
}
.app-item:hover { background: rgba(0,122,255,0.08); }
.app-item.selected { background: rgba(0,122,255,0.12); }
.app-item.selected .app-indicator { visibility: visible; }

.app-indicator {
  width: 3px; height: 13px;
  background: var(--gc-brand);
  border-radius: 2px; margin-left: -4px;
  visibility: hidden;
}

.app-avatar {
  position: relative;
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--gc-surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--gc-text-secondary);
  flex-shrink: 0;
}
.app-avatar.online::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 7px; height: 7px;
  background: var(--gc-success);
  border-radius: 50%;
  border: 1.5px solid var(--gc-bg-secondary);
}

.app-unread {
  position: absolute; top: -7px; right: -7px;
  min-width: 16px; height: 16px;
  background: var(--gc-error); border-radius: 999px;
  font-size: 10px; color: white;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
}

.app-info { flex: 1; min-width: 0; }
.app-name {
  display: flex; align-items: center; gap: 3px;
  font-size: 13px; color: var(--gc-text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.app-proxy {
  font-size: 10px; color: var(--gc-text-tertiary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.app-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.app-item:hover .app-actions { opacity: 1; }
.app-action {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--gc-text-tertiary); cursor: pointer;
  transition: color 0.15s;
}
.app-action:hover { color: var(--gc-brand); }

/* Add App Button */
.add-app-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; height: 36px; margin-top: auto;
  border-radius: 10px; border: 1px dashed var(--gc-border-2);
  background: transparent; color: var(--gc-text-secondary);
  font-size: 12px; cursor: pointer;
  transition: all 0.15s;
}
.add-app-btn:hover { border-color: var(--gc-brand); color: var(--gc-brand); background: rgba(0,122,255,0.05); }

/* =====================================================
   Main Content Area
   ===================================================== */
.main-content {
  flex: 1;
  display: flex;
  min-width: 0;
  background: rgba(10,10,26,0.4);
}

/* Aggregated Chat Layout */
.agg-chat {
  display: flex;
  flex: 1;
  min-width: 0;
}

/* Chat Sidebar */
.chat-sidebar {
  width: 280px;
  flex-shrink: 0;
  background: rgba(18,18,42,0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid var(--gc-border-1);
  display: flex;
  flex-direction: column;
}

.chat-sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--gc-border-1);
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(20px);
}

.search-row { display: flex; gap: 8px; }
.search-input {
  flex: 1; height: 32px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--gc-border-1);
  border-radius: 8px;
  padding: 0 12px;
  font-size: 13px; color: var(--gc-text-primary);
  outline: none; transition: all 0.15s;
}
.search-input::placeholder { color: var(--gc-text-tertiary); }
.search-input:focus { border-color: var(--gc-brand); box-shadow: 0 0 0 2px rgba(0,122,255,0.1); }

.filter-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--gc-border-1);
  border-radius: 8px; cursor: pointer;
  color: var(--gc-text-secondary);
  transition: all 0.15s;
}
.filter-btn:hover { background: rgba(255,255,255,0.1); color: var(--gc-text-primary); }
.filter-btn.active { background: rgba(0,122,255,0.15); border-color: var(--gc-brand); color: var(--gc-brand); }

.sync-indicator {
  display: flex; align-items: center; gap: 5px;
  margin-top: 8px; font-size: 12px;
}
.sync-indicator.syncing { color: var(--gc-success); }
.sync-indicator.error { color: var(--gc-error); cursor: pointer; }
.sync-spin { animation: spin 1.5s linear infinite; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

/* Chat List */
.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
}

.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px;
  font-size: 11px; font-weight: 600;
  color: var(--gc-text-tertiary);
  letter-spacing: 0.5px;
}

.chat-list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  margin-bottom: 1px;
}
.chat-list-item:hover { background: rgba(255,255,255,0.04); }
.chat-list-item.selected {
  background: rgba(0,122,255,0.12);
  border-color: rgba(0,122,255,0.15);
  box-shadow: 0 0 0 1px rgba(0,122,255,0.08);
}
.chat-list-item.unread:not(.selected) { background: rgba(255,255,255,0.025); }

.chat-avatar {
  position: relative;
  width: 40px; height: 40px;
  border-radius: 12px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600;
}
.chat-avatar .status-dot {
  position: absolute; bottom: -1px; right: -1px;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid rgba(18,18,42,0.9);
}
.status-dot.online { background: var(--gc-success); }
.status-dot.offline { background: #8e8e93; }

.platform-badge-mini {
  position: absolute; top: -2px; right: -2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid rgba(18,18,42,0.9);
  display: flex; align-items: center; justify-content: center;
}

.chat-item-content { flex: 1; min-width: 0; }
.chat-item-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chat-item-name {
  font-size: 14px; font-weight: 600;
  color: var(--gc-text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-item-time {
  font-size: 11px; color: var(--gc-text-tertiary);
  flex-shrink: 0;
}
.chat-item-row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.chat-item-preview {
  font-size: 12px; color: var(--gc-text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.chat-list-item.unread .chat-item-preview { color: var(--gc-text-primary); font-weight: 500; }

.unread-badge {
  min-width: 18px; height: 18px;
  background: var(--gc-error);
  border-radius: 999px;
  font-size: 10px; color: white;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px; flex-shrink: 0;
}

/* =====================================================
   Conversation View
   ===================================================== */
.conversation-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background:
    radial-gradient(70% 55% at 20% 0%, rgba(0,122,255,0.08) 0%, transparent 65%),
    radial-gradient(55% 45% at 80% 10%, rgba(0,198,255,0.05) 0%, transparent 70%),
    rgba(10,10,26,0.4);
}

.conv-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--gc-border-1);
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.conv-header-avatar {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  flex-shrink: 0;
}

.conv-header-info { flex: 1; min-width: 0; }
.conv-header-name { font-size: 15px; font-weight: 600; color: var(--gc-text-primary); }
.conv-header-subtitle { font-size: 12px; color: var(--gc-text-secondary); margin-top: 1px; }

.conv-header-actions { display: flex; gap: 4px; }

/* Message List */
.message-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.msg-date-divider {
  text-align: center;
  font-size: 11px;
  color: var(--gc-text-tertiary);
  margin: 16px 0 8px;
  position: relative;
}
.msg-date-divider::before, .msg-date-divider::after {
  content: '';
  position: absolute; top: 50%;
  width: calc(50% - 50px); height: 1px;
  background: var(--gc-border-1);
}
.msg-date-divider::before { left: 0; }
.msg-date-divider::after { right: 0; }

.message-item {
  display: flex;
  margin-bottom: 4px;
  max-width: 72%;
}
.message-item.outgoing { align-self: flex-end; }
.message-item.incoming { align-self: flex-start; }

.msg-bubble {
  padding: 8px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.4;
  word-break: break-word;
  position: relative;
  transition: transform 0.15s;
}
.msg-bubble:hover { transform: translateY(-1px); }

.msg-bubble.outgoing {
  background: linear-gradient(135deg, var(--gc-brand) 0%, var(--gc-brand-gradient-end) 100%);
  color: white;
  border-radius: 18px 18px 4px 18px;
  box-shadow: 0 4px 20px rgba(0,122,255,0.2);
}

.msg-bubble.incoming {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px 18px 18px 4px;
  color: var(--gc-text-primary);
}

.msg-meta {
  display: flex; align-items: center; gap: 4px;
  margin-top: 4px;
  font-size: 10px;
}
.msg-bubble.outgoing .msg-meta { color: rgba(255,255,255,0.6); justify-content: flex-end; }
.msg-bubble.incoming .msg-meta { color: var(--gc-text-tertiary); }

.msg-sender {
  font-size: 11px; font-weight: 600;
  color: var(--gc-brand);
  margin-bottom: 2px;
  margin-left: 2px;
}

.msg-translated {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 12px;
  opacity: 0.7;
  font-style: italic;
}
.msg-bubble.incoming .msg-translated { border-top-color: rgba(255,255,255,0.06); }

.msg-type-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 12px;
}

/* Message Input */
.message-input-area { padding: 12px 16px; }

.message-input-container {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--gc-border-2);
  border-radius: 16px;
  transition: border-color 0.15s;
}
.message-input-container:focus-within { border-color: var(--gc-brand); box-shadow: 0 0 0 3px rgba(0,122,255,0.08); }

.msg-textarea {
  flex: 1;
  background: transparent;
  border: none; outline: none; resize: none;
  font-size: 14px; color: var(--gc-text-primary);
  font-family: inherit;
  max-height: 100px;
  line-height: 1.4;
}
.msg-textarea::placeholder { color: var(--gc-text-tertiary); }

.send-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.1);
  color: var(--gc-text-tertiary);
  transition: all 0.15s;
  flex-shrink: 0;
}
.send-btn.active {
  background: var(--gc-brand);
  color: white;
}
.send-btn.active:hover { background: #0066d6; }

/* =====================================================
   Right Panel
   ===================================================== */
.right-panel {
  width: 300px;
  flex-shrink: 0;
  background: rgba(18,18,42,0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-left: 1px solid var(--gc-border-1);
  display: flex;
  flex-direction: column;
}

.rp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--gc-border-1);
}

.rp-tabs { display: flex; gap: 4px; }

.rp-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  border: none; cursor: pointer;
  background: transparent;
  color: var(--gc-text-secondary);
  transition: all 0.15s;
}
.rp-tab.active { background: var(--gc-brand); color: white; }
.rp-tab:not(.active):hover { background: rgba(255,255,255,0.06); color: var(--gc-text-primary); }

.rp-content { flex: 1; overflow-y: auto; padding: 16px; }

/* CRM Tab */
.crm-field {
  margin-bottom: 12px;
  padding: 12px;
  background: rgba(10,10,26,0.5);
  border-radius: 10px;
  border: 1px solid var(--gc-border-1);
}
.crm-label { font-size: 11px; color: var(--gc-text-secondary); margin-bottom: 4px; }
.crm-value { font-size: 14px; color: var(--gc-text-primary); }

.crm-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.crm-tag {
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  background: rgba(0,122,255,0.15);
  color: var(--gc-brand);
  border: 1px solid rgba(0,122,255,0.2);
}
.crm-tag.warning { background: rgba(255,149,0,0.15); color: var(--gc-warning); border-color: rgba(255,149,0,0.2); }
.crm-tag.success { background: rgba(52,199,89,0.15); color: var(--gc-success); border-color: rgba(52,199,89,0.2); }

/* Translate Tab */
.translate-section {
  margin-bottom: 16px;
  padding: 14px;
  background: rgba(206,219,236,0.06);
  border-radius: 12px;
}

.translate-row {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.translate-label { font-size: 13px; color: var(--gc-text-secondary); width: 56px; }

.translate-select {
  height: 32px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--gc-border-1);
  border-radius: 8px;
  padding: 0 10px;
  font-size: 13px; color: var(--gc-text-primary);
  cursor: pointer; outline: none;
}
.translate-select:focus { border-color: var(--gc-brand); }

.translate-toggle {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.toggle-switch {
  width: 36px; height: 20px;
  border-radius: 999px;
  background: rgba(255,255,255,0.15);
  position: relative; cursor: pointer;
  transition: background 0.2s;
}
.toggle-switch.on { background: var(--gc-success); }
.toggle-switch::after {
  content: '';
  position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: white;
  transition: transform 0.2s;
}
.toggle-switch.on::after { transform: translateX(16px); }

/* =====================================================
   Platform Icons (SVG inline)
   ===================================================== */
.pi { width: 14px; height: 14px; display: inline-flex; flex-shrink: 0; }

/* Splash Screen */
.splash {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--gc-bg-primary);
  transition: opacity 0.5s;
}
.splash.hide { opacity: 0; pointer-events: none; }

.splash-logo {
  width: 64px; height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--gc-brand), var(--gc-brand-gradient-end));
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: white; font-weight: 700;
  box-shadow: 0 8px 32px rgba(0,122,255,0.3);
  margin-bottom: 16px;
  animation: scaleIn 0.5s ease;
}
@keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.splash-text {
  font-size: 16px; font-weight: 600;
  color: var(--gc-text-primary);
}
.splash-sub {
  font-size: 12px; color: var(--gc-text-tertiary);
  margin-top: 4px;
}

.splash-bar {
  width: 120px; height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 999px;
  margin-top: 20px;
  overflow: hidden;
}
.splash-bar-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--gc-brand), var(--gc-brand-gradient-end));
  border-radius: 999px;
  animation: loadBar 1.5s ease forwards;
}
@keyframes loadBar { to { width: 100%; } }

/* Responsive */
@media (max-width: 1100px) {
  .right-panel { display: none; }
}
@media (max-width: 800px) {
  .left-sidebar { width: 60px; }
  .left-sidebar .app-info, .left-sidebar .add-app-btn span, .left-sidebar .sidebar-mode-switcher { display: none; }
  .chat-sidebar { width: 240px; }
}
</style>

<script>
// =====================================================

  { id: 'c10', accountId: 'wa2', name: 'Emily Brown', avatar: 'EB', color: '#25d366', platform: 'whatsapp', lastMsg: 'Sounds great, see you then', time: '周一', unread: 0, online: true, status: 'online', pinned: false },

const messagesByConv = {
  c1: [
    { id: 'm1', dir: 'incoming', sender: 'John Smith', content: 'Hi there! I saw your product listing online', time: '12:25', translated: '你好！我在网上看到了你的产品列表' },
    { id: 'm2', dir: 'incoming', sender: 'John Smith', content: 'Is it still available?', time: '12:25', translated: '还有货吗？' },
    { id: 'm3', dir: 'outgoing', sender: '', content: 'Hello John! Yes, it is still available. We have it in stock and ready to ship.', time: '12:28', translated: null },
    { id: 'm4', dir: 'incoming', sender: 'John Smith', content: 'Great! What is the price including shipping to New York?', time: '12:30', translated: '太好了！包含运到纽约的运费一共多少钱？' },
  ],

    { id: 'm3', dir: 'outgoing', sender: '', content: 'Perfect, the photo looks great. Let me check the details and get back to you.', time: '12:18', translated: null },
  ],
  c3: [
    { id: 'm1', dir: 'incoming', sender: 'Alex Chen', content: 'Hey, I had a question about the warranty', time: '11:40', translated: '嘿，我想问一下保修的事' },
    { id: 'm2', dir: 'outgoing', sender: '', content: 'Hi Alex! Our products come with a 2-year warranty. What specifically would you like to know?', time: '11:42', translated: null },
    { id: 'm3', dir: 'incoming', sender: 'Alex Chen', content: 'Does it cover water damage?', time: '11:45', translated: '保修包括进水损坏吗？' },
    { id: 'm4', dir: 'outgoing', sender: '', content: 'Water damage is covered under our extended care plan. I can send you the details if you would like.', time: '11:47', translated: null },
    { id: 'm5', dir: 'incoming', sender: 'Alex Chen', content: 'Thank you for the quick response!', time: '11:48', translated: '感谢你的快速回复！' },
  ],
};

// =====================================================
// State
// =====================================================
let selectedConvId = 'c1';
let rpTab = 'crm';
let searchQuery = '';
let accountFilterActive = false;

// =====================================================
// Rendering
// =====================================================

function platformIconHTML(platform) {
  const p = platforms[platform];
  if (!p) return '';
  return `<span style="color:${p.color};font-size:10px;font-weight:700;">${p.icon}</span>`;
}

function renderAppList() {
  const container = document.getElementById('app-list');
  container.innerHTML = appList.map(app => {
    const p = platforms[app.platform];
    return `
      <div class="app-item" onclick="selectApp('${app.id}')">
        <div class="app-indicator"></div>
        <div class="app-avatar ${app.online ? 'online' : ''}" style="background:${p.color}22;">
          <span style="color:${p.color};font-size:12px;font-weight:700;">${p.icon}</span>
          ${app.unread > 0 ? `<div class="app-unread">${app.unread > 99 ? '99+' : app.unread}</div>` : ''}

        <div class="app-info">
          <div class="app-name">
            <span style="color:${p.color};font-size:10px;">${p.icon}</span>
            <span>${app.nickname}</span>
          </div>
          <div class="app-proxy">${app.proxy}</div>
        </div>
        <div class="app-actions">
          ${app.online ? `
            <div class="app-action" title="刷新" onclick="event.stopPropagation()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
            </div>
            <div class="app-action" title="关闭" onclick="event.stopPropagation()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </div>
          ` : `
            <div class="app-action" title="打开" onclick="event.stopPropagation()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div class="app-action" title="删除" onclick="event.stopPropagation()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </div>
          `}
        </div>
      </div>
    `;
  }).join('');
}

function renderChatList() {
  const container = document.getElementById('chat-list');
  let filtered = conversations.filter(c => {
    if (searchQuery) {
      return c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
             c.lastMsg.toLowerCase().includes(searchQuery.toLowerCase());
    }
    return true;
  });

  const pinned = filtered.filter(c => c.pinned);
  const recent = filtered.filter(c => !c.pinned);

  let html = '';

  if (pinned.length > 0) {
    html += `<div class="section-header"><span>置顶</span><span>${pinned.length}</span></div>`;
    html += pinned.map(c => renderChatListItem(c)).join('');
  }

  if (recent.length > 0) {
    html += `<div class="section-header" style="margin-top:8px;"><span>最近</span><span>${recent.length}</span></div>`;
    html += recent.map(c => renderChatListItem(c)).join('');
  }

  if (filtered.length === 0) {
    html = `<div style="text-align:center;padding:40px 20px;color:var(--gc-text-tertiary);font-size:13px;">无搜索结果</div>`;
  }

  container.innerHTML = html;
}

function renderChatListItem(c) {
  const isSelected = c.id === selectedConvId;
  const isUnread = c.unread > 0;
  return `
    <div class="chat-list-item ${isSelected ? 'selected' : ''} ${isUnread ? 'unread' : ''}" onclick="selectConv('${c.id}')">
      <div class="chat-avatar" style="background:${c.color}33;color:${c.color};">
        ${c.avatar}
        <div class="status-dot ${c.status || 'offline'}"></div>
      </div>
      <div class="chat-item-content">
        <div class="chat-item-row1">
          <span class="chat-item-name">${c.name}</span>
          <span class="chat-item-time">${c.time}</span>
        </div>
        <div class="chat-item-row2">
          <span class="chat-item-preview">${c.lastMsg}</span>
          ${isUnread ? `<div class="unread-badge">${c.unread > 99 ? '99+' : c.unread}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderConversation() {
  const conv = conversations.find(c => c.id === selectedConvId);
  const container = document.getElementById('conversation-view');

  if (!conv) {
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--gc-text-tertiary);font-size:14px;">选择一个对话开始聊天</div>`;
    return;
  }

  const msgs = messagesByConv[conv.id] || [];
  const subtitle = conv.isGroup ? '群聊' : (conv.status === 'online' ? '在线' : conv.status === 'idle' ? '离开' : '离线');
  const account = appList.find(a => a.id === conv.accountId);

  container.innerHTML = `
    <div class="conv-header">
      <div class="conv-header-avatar" style="background:${conv.color}33;color:${conv.color};">
        ${conv.avatar}
      </div>
      <div class="conv-header-info">
        <div class="conv-header-name">${conv.name}</div>
        <div class="conv-header-subtitle">
          <span style="display:inline-flex;align-items:center;gap:4px;">
            <span style="width:6px;height:6px;border-radius:50%;background:${conv.status === 'online' ? 'var(--gc-success)' : conv.status === 'idle' ? 'var(--gc-warning)' : '#8e8e93'};"></span>
            ${subtitle}
          </span>
          ${account ? ` · <span style="color:${platforms[conv.platform].color};">${platforms[conv.platform].name}</span>` : ''}
        </div>
      </div>
      <div class="conv-header-actions">
        <button class="tb-icon-btn" title="搜索消息">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="tb-icon-btn" title="更多">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
    </div>
    <div class="message-list" id="message-list">
      <div class="msg-date-divider">今天</div>
      ${msgs.map(m => renderMessage(m, conv.isGroup)).join('')}
    </div>
    <div class="message-input-area">
      <div class="message-input-container">
        <textarea class="msg-textarea" id="msg-input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1" oninput="onInputChange()" onkeydown="onInputKeydown(event)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  `;

  scrollToBottom();
}

function renderMessage(m, isGroup) {
  const isOutgoing = m.dir === 'outgoing';
  let content = m.content;

  if (m.isImage) {
    content = `<div style="width:200px;height:140px;border-radius:12px;background:linear-gradient(135deg,#1a1a3e,#2a2a4e);display:flex;align-items:center;justify-content:center;color:var(--gc-text-tertiary);font-size:12px;">[产品图片]</div>`;
  }

  return `
    <div class="message-item ${m.dir}">
      <div>
        ${isGroup && !isOutgoing && m.sender ? `<div class="msg-sender">${m.sender}</div>` : ''}
        <div class="msg-bubble ${m.dir}">
          ${content}
          ${m.translated ? `<div class="msg-translated">↳ ${m.translated}</div>` : ''}
          <div class="msg-meta">
            <span>${m.time}</span>
            ${isOutgoing ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

// =====================================================
// Interactions
// =====================================================

function selectApp(appId) {
  document.querySelectorAll('.app-item').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

function selectConv(convId) {
  selectedConvId = convId;
  // Mark as read
  const conv = conversations.find(c => c.id === convId);
  if (conv) conv.unread = 0;
  renderChatList();
  renderConversation();
  renderRightPanel();
}

function switchRpTab(tab) {
  rpTab = tab;
  document.getElementById('rp-crm').classList.toggle('active', tab === 'crm');
  document.getElementById('rp-translate').classList.toggle('active', tab === 'translate');
  renderRightPanel();
}

function filterConversations() {
  searchQuery = document.getElementById('search-input').value;
  renderChatList();
}

function toggleAccountFilter() {
  accountFilterActive = !accountFilterActive;
  document.querySelector('.filter-btn').classList.toggle('active', accountFilterActive);
}

function switchMode(mode) {
  const isChat = mode === 'chat';
  document.getElementById('mode-chat').classList.toggle('active', isChat);
  document.getElementById('mode-proxy').classList.toggle('active', !isChat);
  document.getElementById('sms-chat').classList.toggle('active', isChat);
  document.getElementById('sms-proxy').classList.toggle('active', !isChat);
}

  // Placeholder for theme toggle
}

function showAddApp() {
  // Placeholder
}

function onInputChange() {
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  btn.classList.toggle('active', input.value.trim().length > 0);
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content) return;

  const conv = conversations.find(c => c.id === selectedConvId);
  if (!conv) return;

  if (!messagesByConv[conv.id]) messagesByConv[conv.id] = [];
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  messagesByConv[conv.id].push({
    id: 'm' + Date.now(),
    dir: 'outgoing',
    sender: '',
    content: content,
    time: timeStr,
    translated: null,
  });

  conv.lastMsg = content;
  conv.time = timeStr;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').classList.remove('active');

  renderConversation();
  renderChatList();

  // Simulate reply
  setTimeout(() => {
    const replies = [
      'Got it, thanks!',
      'Sure, let me check on that.',
      'OK, I will get back to you soon.',
      'Thanks for the update.',
      'Understood, appreciate it!',
    ];
    const reply = replies[Math.floor(Math.random() * replies.length)];
    messagesByConv[conv.id].push({
      id: 'm' + Date.now(),
      dir: 'incoming',
      sender: conv.name,
      content: reply,
      time: timeStr,
      translated: '[翻译] ' + reply,
    });
    conv.lastMsg = reply;
    renderConversation();
    renderChatList();
  }, 1500 + Math.random() * 1000);
}

function scrollToBottom() {
  const list = document.getElementById('message-list');
  if (list) list.scrollTop = list.scrollHeight;
}

}, 5000);
